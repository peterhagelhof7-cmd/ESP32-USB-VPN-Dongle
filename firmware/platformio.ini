; ============================================================================
; ESP32-USB-VPN-Dongle — Wemos S2 Mini (ESP32-S2, natives USB-OTG)
; framework = espidf. Phase 1: USB-NCM Netzwerkadapter + DHCP + Testseite.
; ============================================================================
[platformio]
src_dir = main

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = espidf

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; Phase 5: WireGuard (droscy-Fork, IDF-6-kompatibel). PlatformIO-lib_deps ->
; Header-Pfad wird in main/CMakeLists.txt explizit ergaenzt (LDF linkt lib_deps
; erst am ELF-Schritt, ausserhalb des CMake-Component-Graphen).
lib_deps = droscy/esp_wireguard @ ^0.4.5

; Quelltext + Binary auf UTF-8 (deutsche Umlaute direkt in String-Literalen)
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
    ; esp_wireguard: Default WIREGUARD_MAX_SRC_IPS=1 laesst pro Peer nur EINE
    ; Allowed-IP zu -> Slot ist schon von der eigenen Tunnel-IP (/32) belegt,
    ; add_allowed_ip(0.0.0.0/0) findet keinen freien Slot -> Volltunnel/Routing
    ; wird nie wirksam (jeglicher Nutzdaten-TX -> ERR_RTE). Mehr Slots noetig.
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=8

monitor_speed = 115200
; Nach dem ersten Flash meldet sich der S2 als USB-Netzwerkadapter, nicht mehr
; als serieller Port -> zum Neuflashen ggf. in den Download-Modus (BOOT halten,
; RST tippen). Siehe tools/flash.ps1.

; ============================================================================
; ESP32-S3-DevKitC-1 N16R8 (Dual-Core, 16 MB Flash, 8 MB Octal-PSRAM).
; Natives USB-OTG (GPIO19/20) fuer NCM; interne WS2812-RGB-LED an GPIO48.
; Flashen ueber den UART-Port (CP210x, Auto-Reset) -> kein Download-Modus noetig;
; der NCM-Netzadapter erscheint am separaten nativen USB-Port.
; PSRAM/16-MB-Flash: siehe sdkconfig.defaults.esp32s3.
; ============================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Board-Default ist N8 (8 MB, ohne PSRAM) -> auf N16R8 uebersteuern.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16m.csv

lib_deps = droscy/esp_wireguard @ ^0.4.5

build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=8
    ; Interne adressierbare RGB-LED (WS2812) an GPIO48 -> WS2812-LED-Treiber.
    -DBOARD_LED_WS2812=48

monitor_speed = 115200
