; ============================================================================
; ESP32-USB-VPN-Dongle — Wemos S2 Mini (ESP32-S2, natives USB-OTG)
; framework = espidf. Phase 1: USB-NCM Netzwerkadapter + DHCP + Testseite.
; ============================================================================
[platformio]
src_dir = main

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = espidf

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; Quelltext + Binary auf UTF-8 (deutsche Umlaute direkt in String-Literalen)
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

monitor_speed = 115200
; Nach dem ersten Flash meldet sich der S2 als USB-Netzwerkadapter, nicht mehr
; als serieller Port -> zum Neuflashen ggf. in den Download-Modus (BOOT halten,
; RST tippen). Siehe tools/flash.ps1.
